[package]
name = "fluxdeck"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fluxdeck-core.workspace = true
elgato-streamdeck = "0.14"
notify = "8"
libc = "0.2"
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# Already built for ksni; used directly to follow logind's lock and sleep signals.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
