<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101014">
<title>FluxDeck</title>
<style>
  :root { --bg: #101014; --key: #1d1d24; --text: #e8e6ee; --accent: #9b8cff; --gap: 10px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); gap: 12px; user-select: none; overscroll-behavior: none; }
  nav { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: none; }
  nav button { flex: none; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--key); color: var(--text); font: inherit; }
  nav button.on { background: var(--accent); color: var(--bg); font-weight: 600; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; min-height: 0; }
  #keys { display: grid; gap: var(--gap); width: 100%; max-width: 760px; margin: 0 auto; }
  .key { aspect-ratio: 1; border: 0; padding: 0; border-radius: 16%; overflow: hidden; background: var(--key); transition: transform .08s; }
  .key img, .dial img { width: 100%; height: 100%; display: block; pointer-events: none; }
  .key:active { transform: scale(.92); }
  #dials { display: grid; gap: var(--gap); width: 100%; max-width: 760px; margin: 0 auto; }
  .dial { display: flex; flex-direction: column; gap: 6px; }
  .dial .face { aspect-ratio: 2; border: 0; padding: 0; border-radius: 10px; overflow: hidden; background: var(--key); }
  .dial .row { display: flex; gap: 6px; }
  .dial .row button { flex: 1; border: 0; border-radius: 10px; padding: 12px 0; background: var(--key); color: var(--text); font-size: 18px; }
  .dial button:active, .dial .face:active { filter: brightness(1.4); }
  #wait { text-align: center; opacity: .7; }
</style>
<link rel="manifest" id="manifest">
</head>
<body>
<nav id="pages"></nav>
<main>
  <div id="keys"></div>
  <div id="dials"></div>
  <p id="wait">Conectando con FluxDeck…</p>
</main>
<script>
const key = new URLSearchParams(location.search).get('k') || '';
document.getElementById('manifest').href = '/manifest.webmanifest?k=' + key;
let version = 0, shape = '', frames = {};

function send(t, i, d) {
  if (navigator.vibrate) navigator.vibrate(12);
  fetch('/input?k=' + key, { method: 'POST', body: JSON.stringify({ t, i, d }) }).catch(() => {});
}

function button(cls, onTap) {
  const b = document.createElement('button');
  b.className = cls;
  b.addEventListener('pointerdown', e => { e.preventDefault(); onTap(); });
  return b;
}

function build(l) {
  const keys = document.getElementById('keys'), dials = document.getElementById('dials');
  keys.innerHTML = ''; dials.innerHTML = '';
  keys.style.gridTemplateColumns = `repeat(${l.cols}, 1fr)`;
  for (let i = 0; i < l.cols * l.rows; i++) {
    const b = button('key', () => send('key', i));
    b.appendChild(Object.assign(document.createElement('img'), { id: 'k' + i, alt: '' }));
    keys.appendChild(b);
  }
  dials.style.gridTemplateColumns = `repeat(${l.dials}, 1fr)`;
  dials.style.display = l.dials ? 'grid' : 'none';
  for (let i = 0; i < l.dials; i++) {
    const d = document.createElement('div');
    d.className = 'dial';
    const face = button('face', () => send('press', i));
    face.appendChild(Object.assign(document.createElement('img'), { id: 'd' + i, alt: '' }));
    const row = document.createElement('div');
    row.className = 'row';
    const left = button('', () => send('turn', i, -1)); left.textContent = '−';
    const press = button('', () => send('press', i)); press.textContent = '●';
    const right = button('', () => send('turn', i, 1)); right.textContent = '+';
    row.append(left, press, right);
    d.append(face, row);
    dials.appendChild(d);
  }
  frames = {};
}

function pages(l) {
  const nav = document.getElementById('pages');
  nav.innerHTML = '';
  l.pages.forEach((name, i) => {
    const b = button(i === l.page ? 'on' : '', () => send('page', i));
    b.textContent = name;
    nav.appendChild(b);
  });
  nav.style.display = l.pages.length > 1 ? 'flex' : 'none';
}

function paint(l) {
  const root = document.documentElement.style;
  root.setProperty('--bg', l.bg); root.setProperty('--key', l.key);
  root.setProperty('--text', l.text); root.setProperty('--accent', l.accent);
}

async function loop() {
  for (;;) {
    try {
      const r = await fetch(`/state?k=${key}&v=${version}`);
      if (r.status === 403) { document.getElementById('wait').textContent = 'La clave cambió: vuelve a escanear el QR en FluxDeck.'; return; }
      const s = await r.json();
      version = s.version;
      const l = s.layout;
      if (!l || !l.cols) continue;
      document.getElementById('wait').style.display = 'none';
      const now = `${l.cols}x${l.rows}x${l.dials}`;
      if (now !== shape) { shape = now; build(l); }
      paint(l);
      pages(l);
      for (const [id, v] of Object.entries(s.frames)) {
        const img = document.getElementById(id);
        if (img && frames[id] !== v) { frames[id] = v; img.src = `/img?k=${key}&id=${id}&v=${v}`; }
      }
    } catch (e) {
      document.getElementById('wait').style.display = 'block';
      document.getElementById('wait').textContent = 'Sin conexión con FluxDeck. Reintentando…';
      await new Promise(r => setTimeout(r, 2000));
    }
  }
}
loop();
</script>
</body>
</html>
