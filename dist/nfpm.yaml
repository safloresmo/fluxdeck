# .deb and .rpm packages, built by the release workflow with nfpm (https://nfpm.goreleaser.com).
# VERSION comes from Cargo.toml; build/fluxdeck.service is the unit pointed at /usr/bin.
name: fluxdeck
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Samuel Flores <153472380+safloresmo@users.noreply.github.com>
description: |
  Stream Deck controller for Linux, with app volumes, microphone effects and peripherals.
homepage: https://github.com/safloresmo/fluxdeck
license: MIT

contents:
  - src: target/release/fluxdeck
    dst: /usr/bin/fluxdeck
  - src: target/release/fluxdeck-editor
    dst: /usr/bin/fluxdeck-editor
  - src: build/fluxdeck.service
    dst: /usr/lib/systemd/user/fluxdeck.service
  - src: dist/fluxdeck-editor.desktop
    dst: /usr/share/applications/fluxdeck-editor.desktop
  - src: assets/fluxdeck.svg
    dst: /usr/share/icons/hicolor/scalable/apps/fluxdeck.svg
  # The deck works for whoever sits at the computer, without root.
  - src: dist/70-fluxdeck.rules
    dst: /usr/lib/udev/rules.d/70-fluxdeck.rules
  - src: LICENSE
    dst: /usr/share/doc/fluxdeck/LICENSE

scripts:
  postinstall: dist/postinstall.sh

overrides:
  deb:
    depends: [libudev1, fontconfig]
    recommends: [pipewire, wireplumber, pipewire-pulse]
  rpm:
    depends: [systemd-libs, fontconfig]
    recommends: [pipewire, wireplumber, pipewire-pulseaudio]
